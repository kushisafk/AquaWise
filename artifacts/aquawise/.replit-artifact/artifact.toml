kind = "web"
previewPath = "/"
title = "AquaWise"
description = "A mobile-first irrigation decision support app for farmers, with explainable recommendations, simulated field readings and watering controls, weather forecasts, analytics, calibration, settings, and offline PWA support."
version = "1.0.0"
id = "artifacts/aquawise"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24030

[services.development]
run = "pnpm --filter @workspace/aquawise run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aquawise", "run", "build" ]
serve = "static"
publicDir = "artifacts/aquawise/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24030"
BASE_PATH = "/"

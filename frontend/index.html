<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>AquaWise — Weather-Aware Irrigation</title>
    <meta name="description" content="Simple, weather-aware irrigation guidance for farmers. AquaWise explains every recommendation using clearly labelled field readings." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#234d3f" />
    <meta name="application-name" content="AquaWise" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquaWise" />
    <link rel="apple-touch-icon" href="/icons/aquawise-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="AquaWise — Weather-Aware Irrigation" />
    <meta property="og:description" content="Weather-aware irrigation guidance with clear reasons and explainable recommendations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AquaWise" />
    <meta name="twitter:description" content="Weather-aware irrigation guidance with clear reasons and explainable recommendations." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch(() => {
            window.dispatchEvent(new Event("aquawise:service-worker-unavailable"));
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
